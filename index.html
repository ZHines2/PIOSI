<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Canvas Battle Game with Party Selection</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: #eee;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .screen {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      text-align: center;
      padding: 20px;
    }
    .active {
      display: flex;
    }
    /* Ensure images are rendered in a pixelated style */
    img {
      image-rendering: pixelated;
    }
    canvas {
      border: 1px solid #333;
      background: #444;
      image-rendering: pixelated; /* Also enforce pixelated rendering on canvas scaling */
    }
  </style>
</head>
<body>
  <!-- Title Screen -->
  <div id="title-screen" class="screen active">
    <h1>Welcome to the Battle!</h1>
    <p>Press Space to Start</p>
  </div>

  <!-- Party Selection Screen -->
  <div id="party-select" class="screen">
    <h2>Select Your Party</h2>
    <div id="hero-display"></div>
    <p id="selection-info"></p>
    <p>
      Use Left/Right arrows to navigate and Spacebar to select/deselect heroes.<br />
      Select exactly 3 heroes to proceed.
    </p>
  </div>

  <!-- Battle Screen -->
  <div id="game-screen" class="screen">
    <h2>Battle Field</h2>
    <canvas id="battle-canvas" width="300" height="300"></canvas>
    <p id="status"></p>
    <p>Use Arrow Keys to Move | Press Space to Attack</p>
  </div>

  <!-- Game Over Screen -->
  <div id="game-over" class="screen">
    <h1>Game Over</h1>
    <p>Press Space to Restart</p>
  </div>

  <!-- Main Script -->
  <script type="module">
    // Import heroes from your heroes.js file.
    import { heroes } from "./heroes.js";

    // Global state variables
    let currentScreen = "title-screen";
    const gridSize = 10;
    const cellSize = 30;

    // Party selection variables
    let heroIndex = 0;
    let selectedHeroes = []; // Array holding the indices of selected heroes
    let party = []; // The final party of hero objects

    // Battle variables (for this example, we have one player and one enemy)
    let player = { x: 0, y: 0, hp: 10 };
    let enemy = { x: gridSize - 1, y: gridSize - 1, hp: 5 };

    // Screen management: Show the screen by its ID
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(screen => {
        screen.classList.remove('active');
      });
      document.getElementById(screenId).classList.add('active');
      currentScreen = screenId;

      if (screenId === "party-select") {
        // Begin party selection
        showPartySelection();
      }
      if (screenId === "game-screen") {
        renderBattlefield();
      }
    }

    // Title Screen: Press Space to go to party selection
    document.addEventListener("keydown", (e) => {
      if (currentScreen === "title-screen" && e.code === "Space") {
        showScreen("party-select");
      } else if (currentScreen === "game-over" && e.code === "Space") {
        resetGame();
      }
    });

    // Party Selection Functions
    function updateHeroDisplay() {
      const hero = heroes[heroIndex];
      const heroDisplay = document.getElementById("hero-display");
      heroDisplay.innerHTML = `
        <div class="hero-info">
          <h3>${hero.name} (${hero.symbol})</h3>
          <img src="${hero.sprite}" alt="${hero.name}" width="100" />
          <p>HP: ${hero.hp} | Attack: ${hero.attack} | Range: ${hero.range} | Agility: ${hero.agility}</p>
          ${selectedHeroes.includes(heroIndex) ? '<p>SELECTED</p>' : '<p>Press Space to Select</p>'}
        </div>
      `;
      document.getElementById("selection-info").textContent = `Selected Heroes: ${selectedHeroes.length}/3`;
    }

    function handlePartySelectionKey(e) {
      if (e.key === "ArrowLeft") {
        heroIndex = (heroIndex - 1 + heroes.length) % heroes.length;
        updateHeroDisplay();
      } else if (e.key === "ArrowRight") {
        heroIndex = (heroIndex + 1) % heroes.length;
        updateHeroDisplay();
      } else if (e.key === " " || e.code === "Space") {
        // Toggle selection: add if not selected, or remove if already selected
        if (selectedHeroes.includes(heroIndex)) {
          selectedHeroes = selectedHeroes.filter(i => i !== heroIndex);
        } else if (selectedHeroes.length < 3) {
          selectedHeroes.push(heroIndex);
        }
        updateHeroDisplay();
        // Automatically proceed when exactly 3 heroes are selected
        if (selectedHeroes.length === 3) {
          startGame();
        }
      }
    }

    function showPartySelection() {
      updateHeroDisplay();
      document.addEventListener("keydown", handlePartySelectionKey);
    }

    // Start the game by creating the party from the selected heroes and moving to the battle screen.
    function startGame() {
      // Build the party array from the selected hero indices
      party = selectedHeroes.map(i => ({ ...heroes[i] }));
      console.log("Party Selected:", party);
      // Remove the party selection key listener to avoid conflicts later
      document.removeEventListener("keydown", handlePartySelectionKey);
      showScreen("game-screen");
    }

    // Battle Screen: Canvas Rendering (basic grid, player, enemy)
    function renderBattlefield() {
      const canvas = document.getElementById("battle-canvas");
      const ctx = canvas.getContext("2d");
      // Disable smoothing for a pixelated effect
      ctx.imageSmoothingEnabled = false;
      
      canvas.width = gridSize * cellSize;
      canvas.height = gridSize * cellSize;

      // Clear the canvas
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw the grid and game objects
      for (let row = 0; row < gridSize; row++) {
        for (let col = 0; col < gridSize; col++) {
          const x = col * cellSize;
          const y = row * cellSize;
          ctx.strokeStyle = "#333";
          ctx.strokeRect(x, y, cellSize, cellSize);

          // Draw player ("P")
          if (player.x === col && player.y === row) {
            ctx.fillStyle = "green";
            ctx.fillRect(x, y, cellSize, cellSize);
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("P", x + cellSize / 4, y + cellSize * 0.75);
          }

          // Draw enemy ("E")
          if (enemy.hp > 0 && enemy.x === col && enemy.y === row) {
            ctx.fillStyle = "red";
            ctx.fillRect(x, y, cellSize, cellSize);
            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("E", x + cellSize / 4, y + cellSize * 0.75);
          }
        }
      }

      document.getElementById("status").textContent =
        `Player HP: ${player.hp} | Enemy HP: ${enemy.hp}`;
    }

    // Battle Screen: Movement and attack handling
    document.addEventListener("keydown", (e) => {
      if (currentScreen === "game-screen") {
        switch (e.code) {
          case "ArrowUp":
            movePlayer(0, -1);
            break;
          case "ArrowDown":
            movePlayer(0, 1);
            break;
          case "ArrowLeft":
            movePlayer(-1, 0);
            break;
          case "ArrowRight":
            movePlayer(1, 0);
            break;
          case "Space":
            attackEnemy();
            renderBattlefield();
            break;
        }
      }
    });

    function movePlayer(dx, dy) {
      const newX = player.x + dx;
      const newY = player.y + dy;
      if (newX >= 0 && newX < gridSize && newY >= 0 && newY < gridSize) {
        player.x = newX;
        player.y = newY;
        // If the player steps into the enemy's cell, attack automatically.
        if (player.x === enemy.x && player.y === enemy.y) {
          attackEnemy();
        }
        renderBattlefield();
      }
    }

    function attackEnemy() {
      enemy.hp--;
      if (enemy.hp <= 0) {
        alert("Enemy defeated! You win!");
        showScreen("game-over");
      }
    }

    // Restart game from the beginning
    function resetGame() {
      // Reset battle variables
      player = { x: 0, y: 0, hp: 10 };
      enemy = { x: gridSize - 1, y: gridSize - 1, hp: 5 };
      // Reset party selection variables
      heroIndex = 0;
      selectedHeroes = [];
      party = [];
      showScreen("title-screen");
    }
  </script>
</body>
</html>
